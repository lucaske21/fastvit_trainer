# Model settings
model_name: 'fastvit_t8.apple_in1k'
pretrained: True
num_classes: 1000
drop_rate: 0.0
drop_path_rate: 0.1
input_size: [3, 224, 224]

# Training settings
epochs: 20
batch_size: 128
val_batch_size: 256
num_workers: 8
device: 'cuda'
use_amp: True
output_dir: './output'
validate_interval: 5
checkpoint_interval: 5

# MLflow settings
mlflow:
  enabled: true
  experiment_name: 'fastvit-trainer'
  tracking_uri: http://192.168.31.6:5000
  log_model: true
  log_checkpoints: true
  system_metrics: false
  tags: {}

# Optimizer settings
opt: 'adamw'
lr: 0.001
weight_decay: 0.05
momentum: 0.9

# Scheduler settings
sched: 'cosine'
warmup_lr: 0.000001
warmup_epochs: 5
min_lr: 0.00001

# Data settings
data_dir: './data'
use_dali: True
dali_device_id: 0
dali_decoder_device: 'cpu'
dali_num_threads: 6
dali_seed: 42
val_resize_size: 256
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
interpolation: 'bicubic'
hflip: 0.5
vflip: 0.0
color_jitter: 0.4
auto_augment: 'rand-m9-mstd0.5-inc1'
re_prob: 0.25
re_mode: 'pixel'
re_count: 1
scale: [0.08, 1.0]
ratio: [0.75, 1.3333333333333333]
