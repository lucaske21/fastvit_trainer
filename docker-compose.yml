version: '3.8'

services:
  fastvit_trainer:
    build: .
    image: fastvit_trainer:latest
    container_name: fastvit_training_container
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./output:/workspace/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/workspace
    command: python3 train.py --config configs/base_config.yaml
    working_dir: /workspace
    ipc: host
    stdin_open: true
    tty: true

  tensorboard:
    image: python:3.8-slim
    container_name: fastvit_tensorboard
    depends_on:
      - fastvit_trainer
    volumes:
      - ./output:/workspace/output
    entrypoint: >
      sh -c "pip install tensorboard --quiet &&
             tensorboard --logdir /workspace/output --host 0.0.0.0 --port 6006"
    ports:
      - "6006:6006"
